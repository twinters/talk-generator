[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "talkgenerator"
version = "4.0.0"
description = "Automatically generates presentation slide decks about any topic, for improvised presentations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Winters", email = "info@thomaswinters.be" },
    { name = "Kory Mathewson" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "environs>=11.0",
    "inflect>=7.0",
    "nltk>=3.9",
    "Pillow>=13.0",  # 13.0 fixes ~40 vulnerabilities; it needs Python 3.11+
    "platformdirs>=4",
    "praw>=7.7",
    "python-pptx>=1.0",
    "requests>=2.32",
    "requests-cache>=1.2",
    "tracery>=0.1.1",
    "wordfreq>=3.1",
]

[project.urls]
Homepage = "https://github.com/twinters/talk-generator"
Demo = "https://talkgenerator.com"
Paper = "https://doi.org/10.1007/978-3-030-16667-0_9"

[project.scripts]
talkgenerator = "talkgenerator.run:main_cli"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14",
    "ruff>=0.12",
    "types-requests>=2.33.0.20261030",
]

[tool.setuptools.packages.find]
include = ["talkgenerator*"]

[tool.setuptools.package-data]
talkgenerator = ["data/**/*"]

[tool.setuptools.exclude-package-data]
talkgenerator = ["data/**/*.psd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: talks to external APIs or websites (deselect with -m 'not network')",
]
log_level = "INFO"
log_format = "[%(levelname)s %(asctime)s %(filename)s:%(lineno)s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
python_version = "3.11"
files = ["talkgenerator"]
# Libraries without type information (tracery, nltk, wordfreq, ...) are treated as Any
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Gradual typing: the modules below are fully annotated and checked strictly. The rest of the
# package is checked leniently (only what's annotated). Add a module here once it's typed.
[[tool.mypy.overrides]]
module = [
    "talkgenerator.datastructures.image_data",
    "talkgenerator.schema.registry",
    "talkgenerator.settings",
    "talkgenerator.sources.art_institute",
    "talkgenerator.sources.datamuse",
    "talkgenerator.sources.giphy",
    "talkgenerator.sources.goodreads",
    "talkgenerator.sources.inspirobot",
    "talkgenerator.sources.openverse",
    "talkgenerator.sources.pexels",
    "talkgenerator.sources.pixabay",
    "talkgenerator.sources.reddit",
    "talkgenerator.sources.shitpostbot",
    "talkgenerator.sources.unsplash",
    "talkgenerator.sources.wikihow",
    "talkgenerator.sources.wikimedia_commons",
    "talkgenerator.sources.wikiquote",
    "talkgenerator.sources.word_frequency",
    "talkgenerator.util.cache_util",
    "talkgenerator.util.http_util",
    "talkgenerator.util.image_util",
    "talkgenerator.util.language_util",
    "talkgenerator.util.os_util",
    "talkgenerator.util.random_util",
    "talkgenerator.util.scraper_util",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
source = ["talkgenerator"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are left to the formatter
    "UP031",  # %-formatting in older code
    "UP032",  # .format() calls in older code
    "B006",  # mutable defaults that are never mutated
    "B008",  # function calls in defaults (weight functions)
]


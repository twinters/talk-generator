[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talkgenerator"
version = "4.0.1"
description = "Automatically generates presentation slide decks about any topic, for improvised presentations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Winters", email = "info@thomaswinters.be" },
    { name = "Kory Mathewson" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "environs>=11.0",
    "inflect>=7.0",
    "nltk>=3.9",
    "Pillow>=13.0",  # 13.0 fixes ~40 vulnerabilities; it needs Python 3.11+
    "platformdirs>=4",
    "praw>=7.7",
    "pydantic>=2.7",
    "python-pptx>=1.0",
    "requests>=2.32",
    "requests-cache>=1.2",
    "tracery>=0.1.1",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Language models that write talks (see talkgenerator.llm); without them, talks are classic
anthropic = ["anthropic>=2.1"]
openai = ["openai>=3.37"]  # for OpenRouter and OpenAI
llm = ["talkgenerator[anthropic,openai]"]
# `talkgenerator mcp`: a local MCP server, for Claude Desktop and other MCP clients (see talkgenerator.mcp_server)
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/twinters/talk-generator"
Demo = "https://talkgenerator.com"
Paper = "https://doi.org/10.1007/978-3-030-16667-0_9"

[project.scripts]
talkgenerator = "talkgenerator.run:main_cli"

[dependency-groups]
dev = [
    # The optional language model SDKs, so their adapters get tested and type-checked
    "anthropic>=2.1",
    "openai>=3.37",
    # and the MCP SDK, for the MCP server; not on Windows on Arm (even in an x64 Python there, which says ARM64 too), where
    # the cryptography it needs has no wheels (since 46.0.4) and doesn't build, so that `uv sync` works there (the MCP
    # tests skip: run them in an x64 Python with --extra mcp, as the README's "Tests" says)
    "mcp>=2.3; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14",
    "ruff>=0.12",
    "types-requests>=2.33.0.20261030",
]

[tool.setuptools.packages.find]
include = ["talkgenerator*"]

[tool.setuptools.package-data]
talkgenerator = ["data/**/*"]

[tool.setuptools.exclude-package-data]
talkgenerator = ["data/**/*.psd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: talks to external APIs or websites (deselect with -m 'not network')",
]
log_level = "INFO"
log_format = "[%(levelname)s %(asctime)s %(filename)s:%(lineno)s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
python_version = "3.11"
files = ["talkgenerator"]
# Libraries without type information (tracery, nltk, wordfreq, ...) are treated as Any
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Gradual typing: the modules below are fully annotated and checked strictly. The rest of the
# package is checked leniently (only what's annotated). Add a module here once it's typed.
[[tool.mypy.overrides]]
module = [
    "talkgenerator.checks",
    "talkgenerator.checks.benchmark",
    "talkgenerator.checks.deck",
    "talkgenerator.datastructures.image_data",
    "talkgenerator.llm",
    "talkgenerator.llm.base",
    "talkgenerator.llm.ledger",
    "talkgenerator.llm.prices",
    "talkgenerator.llm.providers",
    "talkgenerator.llm.replay",
    "talkgenerator.mcp_server",
    "talkgenerator.models.base",
    "talkgenerator.models.classic",
    "talkgenerator.models.deck",
    "talkgenerator.models.usage",
    "talkgenerator.render.powerpoint",
    "talkgenerator.schema.registry",
    "talkgenerator.settings",
    "talkgenerator.sources.art_institute",
    "talkgenerator.sources.datamuse",
    "talkgenerator.sources.giphy",
    "talkgenerator.sources.goodreads",
    "talkgenerator.sources.inspirobot",
    "talkgenerator.sources.openverse",
    "talkgenerator.sources.pexels",
    "talkgenerator.sources.pixabay",
    "talkgenerator.sources.reddit",
    "talkgenerator.sources.shitpostbot",
    "talkgenerator.sources.unsplash",
    "talkgenerator.sources.wikihow",
    "talkgenerator.sources.wikimedia_commons",
    "talkgenerator.sources.wikiquote",
    "talkgenerator.sources.word_frequency",
    "talkgenerator.util.cache_util",
    "talkgenerator.util.http_util",
    "talkgenerator.util.image_util",
    "talkgenerator.util.language_util",
    "talkgenerator.util.os_util",
    "talkgenerator.util.random_util",
    "talkgenerator.util.scraper_util",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
source = ["talkgenerator"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID251"]
ignore = [
    "E501",  # long lines are left to the formatter
    "UP031",  # %-formatting in older code
    "UP032",  # .format() calls in older code
    "B006",  # mutable defaults that are never mutated
    "B008",  # function calls in defaults (weight functions)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Draw from talkgenerator.util.random_util instead, so that a talk's seed decides all its random choices"

[tool.ruff.lint.per-file-ignores]
"talkgenerator/util/random_util.py" = ["TID251"]  # the one place that wraps the random module
"tests/**" = ["TID251"]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talkgenerator"
version = "4.0.0"
description = "Automatically generates presentation slide decks about any topic, for improvised presentations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Winters", email = "info@thomaswinters.be" },
    { name = "Kory Mathewson" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "environs>=11.0",
    "inflect>=7.0",
    "nltk>=3.9",
    "Pillow>=10.1",
    "platformdirs>=4",
    "praw>=7.7",
    "python-pptx>=1.0",
    "requests>=2.32",
    "requests-cache>=1.2",
    "tracery>=0.1.1",
    "wordfreq>=3.1",
]

[project.urls]
Homepage = "https://github.com/twinters/talk-generator"
Demo = "https://talkgenerator.com"
Paper = "https://doi.org/10.1007/978-3-030-16667-0_9"

[project.scripts]
talkgenerator = "talkgenerator.run:main_cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
include = ["talkgenerator*"]

[tool.setuptools.package-data]
talkgenerator = ["data/**/*"]

[tool.setuptools.exclude-package-data]
talkgenerator = ["data/**/*.psd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: talks to external APIs or websites (deselect with -m 'not network')",
]
log_level = "INFO"
log_format = "[%(levelname)s %(asctime)s %(filename)s:%(lineno)s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["talkgenerator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are left to the formatter
    "UP031",  # %-formatting in older code
    "UP032",  # .format() calls in older code
    "B006",  # mutable defaults that are never mutated
    "B008",  # function calls in defaults (weight functions)
]

[tool.ruff.lint.per-file-ignores]
# These modules build the generator catalogue through star imports on purpose
"talkgenerator/schema/*.py" = ["F403", "F405"]
